<!doctype html>
<html>

<head>
    <title>Host Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        // 每 15 秒自动刷新
        setInterval(() => location.reload(), 15000);
    </script>
</head>

<body class="p-4">
    <h2>Host Status Dashboard</h2>
    <table class="table table-striped table-hover mt-3">
        <thead>
            <tr>
                <th>IP</th>
                <th>CPU %</th>
                <th>Memory %</th>
                <th>Disk %</th>
                <th>Status</th>
                <th>Updated</th>
            </tr>
        </thead>
        <tbody>
            {% for host in hosts %}
            <tr class="{% if not host.online %}table-danger{% endif %}">
                <td>{{ host.ip }}</td>
                <td>{{ host.cpu }}</td>
                <td>{{ host.memory }}</td>
                <td>{{ host.disk }}</td>
                <td>{{ host.status }}</td>
                <td>{{ host.created_at }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>

</html>
